<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendrier lunaire — maquette</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/moon.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <button type="button" class="back">‹ Retour au grimoire</button>
  <main class="lune">
    <header class="head">
      <h1>Calendrier lunaire</h1>
      <p>Heure de Paris</p>
      <span class="divider"></span>
      <nav class="tabs" aria-label="Vues">
        <button type="button" class="tab on" data-view="today">Aujourd’hui</button>
        <button type="button" class="tab" data-view="month">Calendrier</button>
        <button type="button" class="tab" data-view="year">Lunaisons</button>
      </nav>
    </header>

    <section class="view" id="v-today">
      <div class="today">
        <div class="moon-col">
          <canvas id="big-moon" class="big-moon" aria-hidden="true"></canvas>
          <div class="daynav">
            <button type="button" id="t-prev" aria-label="Jour précédent">‹</button>
            <span id="t-date"></span>
            <button type="button" id="t-next" aria-label="Jour suivant">›</button>
          </div>
          <button type="button" id="t-back" class="link" hidden>Revenir à aujourd’hui</button>
        </div>
        <div class="info-col">
          <p class="phase-name" id="t-name"></p>
          <div class="stats">
            <div><span id="t-illum"></span><small>éclairée</small></div>
            <div><span id="t-age"></span><small>âge de la lune</small></div>
          </div>
          <article class="card" id="t-card">
            <div class="card-icon" id="t-card-icon"></div>
            <div>
              <h2 id="t-card-title"></h2>
              <p class="motto" id="t-card-motto"></p>
              <ul id="t-card-tips"></ul>
            </div>
          </article>
          <p class="event" id="t-event"></p>
          <div class="bar" id="t-bar"></div>
        </div>
      </div>
    </section>

    <section class="view" id="v-month" hidden>
      <div class="monthnav">
        <button type="button" id="m-prev" aria-label="Mois précédent">‹</button>
        <h2 id="m-title"></h2>
        <button type="button" id="m-next" aria-label="Mois suivant">›</button>
      </div>
      <div class="grid" id="m-grid"></div>
    </section>

    <section class="view" id="v-year" hidden>
      <div class="monthnav">
        <button type="button" id="y-prev" aria-label="Année précédente">‹</button>
        <h2 id="y-title"></h2>
        <button type="button" id="y-next" aria-label="Année suivante">›</button>
      </div>
      <div class="table-wrap"><table id="y-table"></table></div>
    </section>
  </main>
  <script type="module" src="js/moon-ui.js"></script>
</body>
</html>
